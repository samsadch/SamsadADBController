name: Publish Packages to NPM

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: |
          npm run build --workspace=@samsadch/adb-core
          npm run build --workspace=@samsadch/adb-mcp

      - name: Run unit tests
        run: |
          npm test --workspace=@samsadch/adb-core
          npm test --workspace=@samsadch/adb-mcp

      - name: Authenticate with NPM
        run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publishes in dependency order and skips any version already on the registry.
      # Without the skip, a run where only one package changed fails with
      # "E403 cannot publish over the previously published versions" and never
      # reaches the package that actually needs releasing.
      - name: Publish changed packages
        run: |
          set -euo pipefail
          for pkg in packages/adb-core packages/adb-mcp; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version — already published."
            else
              echo "Publishing $name@$version"
              npm publish "./$pkg"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
