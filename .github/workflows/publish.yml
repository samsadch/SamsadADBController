name: Publish Packages to NPM

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: |
          npm run build --workspace=@samsadch/adb-core
          npm run build --workspace=@samsadch/adb-mcp

      - name: Run unit tests
        run: |
          npm test --workspace=@samsadch/adb-core
          npm test --workspace=@samsadch/adb-mcp

      - name: Authenticate with NPM
        run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @samsadch/adb-core
        run: npm publish ./packages/adb-core --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @samsadch/adb-mcp
        run: npm publish ./packages/adb-mcp --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
